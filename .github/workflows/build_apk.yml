name: Build GraphWidget APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager не найден в $ANDROID_HOME"
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Preflight - проверить исходники
        run: |
          MISSING=""
          for f in MainActivity.kt GarminClient.kt GraphWidget.kt ActivityWidget.kt BootReceiver.kt \
                   strings.xml widget_info.xml widget_activity_info.xml \
                   widget_calorie_chart.xml widget_activity_chart.xml \
                   AndroidManifest.xml app_build_gradle.txt root_build_gradle.txt; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::В репозитории нет файлов:$MISSING"
            exit 1
          fi

      - name: Build APK
        run: |
          chmod +x setup_project.sh
          ./setup_project.sh
          gradle assembleDebug --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk graph.apk

      - uses: actions/upload-artifact@v4
        with:
          name: graphwidget-apk
          path: graph.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: graph.apk
